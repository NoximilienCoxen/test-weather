name: build

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Indipendente dal build: voglio il contratto reale dell'API anche quando
  # la compilazione fallisce.
  probe-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Interroga Open-Meteo
        run: |
          mkdir -p /tmp/ciout
          BASE="https://api.open-meteo.com/v1/forecast?latitude=44.2226&longitude=12.0407&timezone=auto&forecast_days=7&wind_speed_unit=ms"
          CUR="current=temperature_2m,relative_humidity_2m,apparent_temperature,dew_point_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day"
          SAFE="daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,uv_index_max"
          EXTRA="${SAFE},relative_humidity_2m_mean,dew_point_2m_mean,precipitation_hours,rain_sum,snowfall_sum,sunshine_duration"
          # Le grandezze orarie che il dettaglio usa davvero. Le ultime undici
          # sono quelle aggiunte: se una viene ritirata a monte, e' qui che si
          # vede, e non in una schermata che mostra trattini senza spiegazione.
          HOURLY="hourly=temperature_2m,apparent_temperature,weather_code,precipitation,precipitation_probability,is_day,relative_humidity_2m,dew_point_2m,wind_speed_10m,wind_gusts_10m,wind_direction_10m,uv_index,cloud_cover,surface_pressure,visibility,rain,snowfall"
          echo "--- safe ---"
          curl -sS -w "\nHTTP %{http_code}\n" "${BASE}&${CUR}&${SAFE}"  -o /tmp/ciout/safe.json
          echo "--- extra ---"
          curl -sS -w "\nHTTP %{http_code}\n" "${BASE}&${CUR}&${EXTRA}" -o /tmp/ciout/extra.json
          echo "--- orario ---"
          curl -sS -w "\nHTTP %{http_code}\n" "${BASE}&${CUR}&${SAFE}&${HOURLY}" -o /tmp/ciout/hourly.json
          head -c 400 /tmp/ciout/safe.json; echo
          head -c 400 /tmp/ciout/extra.json; echo

      # La qualita' dell'aria sta su un altro host e ha un contratto suo: il
      # widget che la mostra si fida di questi nomi di campo, e qui si vede se
      # sono ancora quelli.
      # **E fuori Europa?** L'indice europeo e' una scala europea, e applicarla
      # a Tokyo da' un numero giusto su una scala sbagliata. La domanda vera e'
      # se l'endpoint lo riempia comunque fuori dal suo dominio o lo lasci
      # nullo: da quella risposta dipende se l'app puo' lasciar decidere ai
      # dati quale scala usare, o se deve deciderlo da se'. Si chiede quindi
      # negli stessi tre punti in cui si guarda tutto il resto.
      - name: Interroga la qualita' dell'aria
        run: |
          mkdir -p /tmp/ciout
          VARS="european_aqi,us_aqi,pm2_5,pm10"
          BASE="https://air-quality-api.open-meteo.com/v1/air-quality"
          AIR="$BASE?latitude=44.2226&longitude=12.0407&timezone=auto&current=$VARS"
          curl -sS -w "\nHTTP %{http_code}\n" "$AIR" -o /tmp/ciout/aria.json
          cat /tmp/ciout/aria.json; echo
          {
            echo "=== l'indice europeo, dentro e fuori il suo dominio ==="
            for punto in "Forli:44.2226:12.0407" "Tokyo:35.68:139.69" \
                         "NewYork:40.71:-74.01" "Nairobi:-1.29:36.82"; do
              nome="${punto%%:*}"; resto="${punto#*:}"
              lat="${resto%%:*}"; lon="${resto#*:}"
              echo "--- $nome"
              curl -sS "$BASE?latitude=$lat&longitude=$lon&timezone=auto&current=$VARS"
              echo
            done
          } > /tmp/ciout/aria-mondo.txt 2>&1
          cat /tmp/ciout/aria-mondo.txt

      # Le allerte vengono da MeteoAlarm, che e' l'unica fonte pubblica e senza
      # accordi su cui i servizi nazionali - per l'Italia la Protezione Civile e
      # i centri funzionali regionali - pubblicano i propri avvisi.
      #
      # Questo passo e' l'unico posto del progetto da cui il feed sia davvero
      # raggiungibile, e serve a due cose. La prima: gli RSS legacy sono stati
      # spenti il 14 gennaio 2026, quindi si verifica che l'Atom risponda. La
      # seconda, piu' importante: il parser si fida di `cap:event` - dove il
      # colore sta scritto in inglese dentro la frase - e di `cap:severity`,
      # `cap:areaDesc`, `cap:expires`. Se uno di quei nomi cambia a monte l'app
      # smetterebbe di mostrare le allerte **senza dirlo a nessuno**.
      #
      # Questo passo si e' gia' guadagnato lo stipendio: la prima stesura del
      # parser cercava `awareness_level` e `awareness_type`, che nel feed non
      # esistono. Zero occorrenze su trentacinquemila byte, e ogni allerta
      # sarebbe uscita come una gialla generica.
      #
      # Non fa fallire il giro: un feed di allertamento momentaneamente giu' non
      # e' un difetto del codice, e l'app in quel caso ripiega sulle soglie.
      - name: Interroga MeteoAlarm
        continue-on-error: true
        run: |
          mkdir -p /tmp/ciout
          FEED="https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-italy"
          curl -sSL -w "\nHTTP %{http_code}\n" "$FEED" -o /tmp/ciout/allerte.xml
          echo "--- byte ricevuti: $(wc -c < /tmp/ciout/allerte.xml) ---"
          head -c 600 /tmp/ciout/allerte.xml; echo
          for campo in "cap:event" "cap:severity" "cap:areaDesc" "cap:expires"; do
            n=$(grep -o "$campo" /tmp/ciout/allerte.xml | wc -l)
            echo "$campo: $n occorrenze"
            if [ "$n" -eq 0 ]; then
              echo "ATTENZIONE: '$campo' non compare piu' nel feed"
            fi
          done

      # Quale modello numerico e' il piu' fine sopra l'Emilia-Romagna non si
      # risponde a memoria: i modelli vengono aggiunti e ritirati, e uno
      # accettato non e' lo stesso di uno che ha davvero dei valori sopra
      # Noceto. Lo si chiede all'API, e la risposta finisce fra gli artefatti.
      # ── E le allerte fuori Europa? ──────────────────────────────────────────
      #
      # MeteoAlarm copre l'Europa e basta: a Tokyo, New York o Sydney l'app non
      # mostra **nessun** avviso, e non perche' non ce ne siano. Il buco di
      # copertura mondiale e' questo, non la previsione - quella `best_match` la
      # prende gia' dai modelli nazionali.
      #
      # La fonte mondiale plausibile e' il Severe Weather Information Centre
      # della WMO, gestito dall'osservatorio di Hong Kong, che raccoglie in CAP
      # i bollettini di oltre centotrenta servizi nazionali. Il formato e' lo
      # stesso che l'app **sa gia' leggere**: `parseFeed` e `toAlert` esistono,
      # sono provati contro il bollettino vero, e una seconda fonte CAP
      # riuserebbe parser, modello e schermata.
      #
      # Qui non si scrive ancora una riga di parser, e non e' prudenza: e' la
      # lezione che questo passo si e' gia' guadagnata una volta. La prima
      # stesura del lettore di MeteoAlarm cercava `awareness_level` e
      # `awareness_type`, che nel feed **non esistono** - zero occorrenze su
      # trentacinquemila byte - e ogni allerta sarebbe uscita gialla generica.
      # Da questo container gli indirizzi qui sotto non si raggiungono, quindi
      # scrivere il parser adesso vorrebbe dire scriverlo a memoria: **prima si
      # guarda cosa risponde davvero.**
      #
      # **Il primo giro ha gia' insegnato qualcosa**: quattro indirizzi provati a
      # memoria, quattro 404. Risponde solo la pagina che li elenca, e gli
      # indirizzi veri stanno scritti dentro di lei - quindi adesso si leggono
      # di li' invece di continuare a indovinarli. E' la stessa disciplina di
      # `probe_models`, che l'elenco dei modelli se lo fa dare dall'errore
      # dell'API invece di tenerne una copia.
      #
      # Nessun passo qui fa fallire il giro: una fonte di allertamento
      # momentaneamente giu' non e' un difetto del codice.
      #
      # Il FOSS Public Alert Server, l'altra fonte mondiale in circolazione, non
      # e' fra questi apposta: chi lo scrive dichiara che **non e' ancora pronto
      # per la produzione**, e una fonte di allertamento in sviluppo e' la cosa
      # meno adatta a cui affidare un avviso di temporale.
      - name: Interroga le allerte mondiali
        continue-on-error: true
        run: |
          mkdir -p /tmp/ciout
          {
            echo "=== la pagina degli indirizzi, e quali indirizzi porta ==="
            #
            # Il primo giro aveva provato quattro strade indovinate a memoria e
            # **tutte e quattro erano 404**: risponde solo questa pagina, e gli
            # indirizzi veri stanno scritti dentro. Leggerli di li' e' l'unico
            # modo che non passa per un'ipotesi.
            PAGE="https://severeweather.wmo.int/feeds.html"
            curl -sSL --max-time 25 -H "User-Agent: caelum-probe" "$PAGE" \
              -o /tmp/ciout/_feeds.html || true
            echo "--- $PAGE  byte=$(wc -c < /tmp/ciout/_feeds.html)"
            echo "--- indirizzi che sembrano feed, presi dalla pagina:"
            grep -oE 'https?://[^"'"'"'<> ]+\.(xml|json|rss|atom|cap)[^"'"'"'<> ]*' \
              /tmp/ciout/_feeds.html | sort -u | head -40
            echo "--- ogni altro indirizzo assoluto della pagina:"
            grep -oE 'https?://[^"'"'"'<> ]+' /tmp/ciout/_feeds.html \
              | grep -viE '\.(css|js|png|jpg|ico|ttf|woff2?)' | sort -u | head -40
            echo

            # **La pagina non porta nessun indirizzo di feed nel suo HTML**: la
            # lista se la costruisce da sola con JavaScript, e il titolo dice
            # "(Demo)". Restano allora i link che la pagina **s'i** contiene, e
            # il piu' promettente e' il registro delle autorita' di
            # allertamento: e' li' che stanno, se stanno da qualche parte, gli
            # indirizzi CAP dei servizi nazionali.
            echo "=== cosa risponde davvero ==="
            for url in \
              "https://alertingauthority.wmo.int/authorities.json" \
              "https://alertingauthority.wmo.int/" \
              "https://severeweather.wmo.int/v2/json/list.json" \
              "https://api.weather.gov/alerts/active?limit=1" \
              ; do
              echo "--- $url"
              code=$(curl -sSL -o /tmp/ciout/_a -w "%{http_code}" \
                     -H "User-Agent: caelum-probe (github.com/NoximilienCoxen/test-weather)" \
                     -H "Accept: application/json" --max-time 25 "$url" || echo 000)
              echo "HTTP $code  tipo=$(file -b --mime-type /tmp/ciout/_a 2>/dev/null)" \
                   " byte=$(wc -c < /tmp/ciout/_a)"
              head -c 1200 /tmp/ciout/_a; echo; echo
            done
          } > /tmp/ciout/allerte-mondo.txt 2>&1
          rm -f /tmp/ciout/_a /tmp/ciout/_feeds.html
          cat /tmp/ciout/allerte-mondo.txt

      - name: Quali modelli coprono l'Italia
        run: python3 scripts/probe_models.py

      # Quali versioni delle dipendenze esistano oggi non si risponde a memoria,
      # ed e' un guaio silenzioso: il progetto si e' ritrovato una Compose BOM
      # del 2026 accanto a un core-ktx del 2024 senza che niente lo segnalasse.
      # Da dentro il container di sviluppo dl.google.com e Maven Central non si
      # raggiungono (403 al CONNECT), quindi la domanda si gira qui, come gia'
      # si fa per i modelli numerici e per il formato del feed MeteoAlarm.
      #
      # Non fa fallire il giro: una dipendenza vecchia e' una decisione da
      # prendere leggendo l'elenco, non un errore di compilazione.
      - name: Quali versioni esistono davvero
        continue-on-error: true
        run: OUT=/tmp/ciout/dipendenze.txt python3 scripts/probe_deps.py

      - name: Pubblica
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish.sh api

  # I test stanno in un job loro e non dentro `build`: sono veloci, non hanno
  # bisogno dell'SDK completo, e con l'APK che dipende da `build` un test rosso
  # non deve impedire di avere comunque un APK da installare. Cio' che dicono
  # si legge lo stesso.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Componenti SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0" \
            || echo "sdkmanager non ha installato: lascio che sia AGP a scaricare"

      # Lint gira accanto ai test e non dentro `build`: sono i due controlli che
      # parlano del codice, mentre `build` produce l'artefatto.
      #
      # Con `textReport` il referto finisce **nel log**, non solo in un HTML da
      # scaricare: da qui gli artefatti non si aprono, e un rapporto che nessuno
      # legge non e' un controllo.
      - name: lintDebug
        run: ./gradlew lintDebug --no-daemon

      # **I test girano prima di qualunque caricamento, e girano comunque.**
      #
      # Prima stavano dopo l'upload del referto di lint, e questo bastava a
      # saltarli del tutto. Il change che lo ha insegnato: sul commit 87746a1 di
      # `main` il caricamento ha trasferito i suoi trentamila byte e poi e'
      # morto nel *finalizzare* l'artefatto, con un 403 che veniva
      # dall'archivio di GitHub e non da noi:
      #
      #   Failed to FinalizeArtifact: non-retryable error: (403) Forbidden
      #
      # Il passo non aveva `continue-on-error`, quindi `testDebugUnitTest` e'
      # stato **saltato**, e il caricamento seguente lo ha confermato senza che
      # nessuno lo leggesse: "No files were found with the provided path:
      # app/build/reports/tests/". Ottantasei prove non eseguite, e la
      # schermata delle Actions che diceva "test: failure" - cioe' la stessa
      # faccia che avrebbe avuto un test rosso davvero.
      #
      # Da qui le tre regole di questo job: i test stanno prima, hanno
      # `if: always()` cosi' un lint rosso non se li porta dietro, e **nessun
      # caricamento puo' far fallire niente**. Un artefatto e' una comodita' per
      # chi legge dopo; le prove sono il controllo.
      - name: testDebugUnitTest
        if: always()
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee /tmp/test.log || {
            echo ""
            echo "===================== TEST FALLITI ======================="
            grep -E "^e: |FAILED|expected:|AssertionError|junit" /tmp/test.log | head -60
            echo "=========================================================="
            exit 1
          }

      # **Il conto, scritto nel log.**
      #
      # Un giro verde non dice se le prove sono girate: puo' voler dire che sono
      # passate tutte, oppure che non ne e' partita nessuna. Sono due cose molto
      # diverse e finora avevano la stessa faccia. Qui si contano dagli XML e il
      # numero finisce nel log, dove si legge senza scaricare niente.
      #
      # Zero prove **fa fallire il giro**: e' la guardia che sarebbe servita.
      - name: Quante prove sono girate
        if: always()
        run: |
          risultati=app/build/test-results/testDebugUnitTest
          if [ ! -d "$risultati" ]; then
            echo "NESSUN RISULTATO: $risultati non esiste."
            echo "I test non sono partiti affatto - non e' che siano passati."
            exit 1
          fi
          prove=$(grep -ho 'tests="[0-9]*"' "$risultati"/*.xml \
            | grep -o '[0-9]*' | paste -sd+ - | bc)
          falliti=$(grep -ho 'failures="[0-9]*"' "$risultati"/*.xml \
            | grep -o '[0-9]*' | paste -sd+ - | bc)
          errori=$(grep -ho 'errors="[0-9]*"' "$risultati"/*.xml \
            | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "=========================================================="
          echo "  prove eseguite: ${prove:-0}"
          echo "  fallite: ${falliti:-0}   in errore: ${errori:-0}"
          echo "=========================================================="
          if [ "${prove:-0}" -eq 0 ]; then
            echo "ZERO PROVE ESEGUITE: il job e' verde ma non ha controllato niente."
            exit 1
          fi

      # I due referti, in coda e senza potere di nuocere.
      #
      # `continue-on-error` su entrambi: un 403 dell'archivio artefatti di
      # GitHub non e' un difetto di questo progetto, e non deve tingere di rosso
      # un giro in cui il codice sta bene ne' - come e' successo - impedire ai
      # test di partire.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      # Il rapporto per esteso: quando un test cade, la riga del log dice che e'
      # caduto e l'XML dice perche'. L'HTML si legge, l'XML si interroga: qui
      # servono tutti e due.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Componenti SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "--- pacchetti disponibili ---"
          sdkmanager --list 2>/dev/null \
            | grep -E "platforms;android-3[5-9]|build-tools;3[6-9]" | head -20 || true
          echo "--- installo ---"
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0" \
            || echo "sdkmanager non ha installato: lascio che sia AGP a scaricare"

      - name: Versioni in uso
        run: |
          java -version
          ./gradlew --version

      # Niente --stacktrace: seppelliva gli errori Kotlin sotto trecento righe
      # di stack Gradle. Se fallisce, gli errori veri finiscono in coda al log.
      - name: assembleDebug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/build.log || {
            echo ""
            echo "================= ERRORI DI COMPILAZIONE ================="
            grep -E "^e: |^w: .*(error|Error)" /tmp/build.log | head -40
            echo "=========================================================="
            exit 1
          }

      # La release adesso passa da R8, e un flag che non compila nessuno non e'
      # acceso: e' solo scritto. Qui ci passa a ogni giro, cosi' una regola di
      # keep che manca si vede subito invece che il giorno in cui si pubblica.
      - name: assembleRelease
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/release.log || {
            echo ""
            echo "=================== ERRORI SULLA RELEASE ================="
            grep -E "^e: |R8|Missing class|proguard" /tmp/release.log | head -40
            echo "=========================================================="
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Livello 3: l'APK in mano al telefono. Tag fisso, cosi' il link resta
  # sempre lo stesso e si puo' salvare fra i preferiti.
  #
  # Solo da main: un push su un branch claude/* di lavoro non deve mai
  # sovrascrivere l'unica release che le persone installano. Prima di
  # questa condizione ogni branch in corso, mai unito agli altri, poteva
  # spedire sul telefono una build con funzionalita' diverse a caso.
  rilascio:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Prepara il file
        run: |
          mkdir -p rilascio
          cp "$(find apk -name '*.apk' | head -1)" rilascio/weather.apk
          ls -la rilascio

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Weather — ultima build
          prerelease: true
          files: rilascio/weather.apk
          body: |
            APK di debug, sempre aggiornato all'ultimo commit del branch di sviluppo.

            **Installazione dal telefono**
            1. Tocca `weather.apk` qui sotto per scaricarlo.
            2. Android chiedera' di autorizzare l'installazione da questa
               sorgente: e' la richiesta normale per le app fuori dallo store.
            3. Apri il file scaricato e installa.

            La firma e' una chiave di debug fissa, quindi le build successive
            si installano sopra la precedente senza doverla disinstallare.

            Commit: ${{ github.sha }}

      # Il rilascio conserva gli allegati che nessuno sovrascrive. Rinominando
      # l'APK ne sono rimasti due, uno vecchio e uno nuovo, e chi arriva sulla
      # pagina non ha modo di sapere quale sia quello buono: se ne scarica uno a
      # caso e installa l'app di ieri.
      - name: Togli gli allegati che non c'entrano piu'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          presenti=$(gh release view apk-latest --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')
          for allegato in $presenti; do
            [ "$allegato" = "weather.apk" ] && continue
            echo "rimuovo allegato obsoleto: $allegato"
            gh release delete-asset apk-latest "$allegato" \
              --repo "$GITHUB_REPOSITORY" --yes
          done

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "kvm:"; ls -l /dev/kvm || echo "NESSUN /dev/kvm"

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Emulatore e cattura
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          # Il giro precedente moriva a meta' con "Failed to find ColorBuffer"
          # (trappola #38, e adesso se ne conosce il meccanismo): trenta scatti
          # vogliono trenta riavvii dell'app, ogni riavvio ricrea una superficie
          # GL, e prima o poi il guest chiede al lato host un buffer che il lato
          # host non ha piu'. Qui si tolgono le due cose che glielo rendono piu'
          # probabile - poca memoria e uno snapshot che gia' nel log falliva il
          # caricamento - e gli si danno i quattro processori del runner invece
          # di uno.
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: bash scripts/capture.sh

      - name: Pubblica
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish.sh screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: /tmp/ciout
          if-no-files-found: warn
