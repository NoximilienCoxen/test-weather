name: build

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Indipendente dal build: voglio il contratto reale dell'API anche quando
  # la compilazione fallisce.
  probe-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Interroga Open-Meteo
        run: |
          mkdir -p /tmp/ciout
          BASE="https://api.open-meteo.com/v1/forecast?latitude=44.2226&longitude=12.0407&timezone=auto&forecast_days=7&wind_speed_unit=ms"
          CUR="current=temperature_2m,relative_humidity_2m,apparent_temperature,dew_point_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day"
          SAFE="daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,uv_index_max"
          EXTRA="${SAFE},relative_humidity_2m_mean,dew_point_2m_mean,precipitation_hours,rain_sum,snowfall_sum"
          HOURLY="hourly=temperature_2m,weather_code,precipitation,precipitation_probability,wind_speed_10m,wind_direction_10m,is_day,apparent_temperature"
          echo "--- safe ---"
          curl -sS -w "\nHTTP %{http_code}\n" "${BASE}&${CUR}&${SAFE}"  -o /tmp/ciout/safe.json
          echo "--- extra ---"
          curl -sS -w "\nHTTP %{http_code}\n" "${BASE}&${CUR}&${EXTRA}" -o /tmp/ciout/extra.json
          echo "--- orario ---"
          curl -sS -w "\nHTTP %{http_code}\n" "${BASE}&${CUR}&${SAFE}&${HOURLY}" -o /tmp/ciout/hourly.json
          head -c 400 /tmp/ciout/safe.json; echo
          head -c 400 /tmp/ciout/extra.json; echo

      - name: Pubblica
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish.sh api

  build:
    runs-on: ubuntu-latest
    # Il segreto viene esposto come variabile d'ambiente del job perche' il
    # contesto `secrets` non e' consultabile dentro un `if` di passo: scriverci
    # `secrets.QUALCOSA` non e' falso, e' un workflow che non viene accettato.
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Componenti SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "--- pacchetti disponibili ---"
          sdkmanager --list 2>/dev/null \
            | grep -E "platforms;android-3[5-9]|build-tools;3[6-9]" | head -20 || true
          echo "--- installo ---"
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0" \
            || echo "sdkmanager non ha installato: lascio che sia AGP a scaricare"

      - name: Versioni in uso
        run: |
          java -version
          ./gradlew --version

      # L'identita' del pacchetto.
      #
      # Il numero di versione cresce col numero della corsa, e la data di build
      # e' quella del commit. Servono a due cose diverse e ugualmente concrete:
      # un versionCode che sale fa di ogni pubblicazione un **aggiornamento**
      # invece di un'installazione laterale, e l'istante di build e' il solo
      # appiglio che l'app ha per sapere se quella pubblicata e' piu' recente
      # di lei, visto che il tag del rilascio e' fisso e non lo dice.
      - name: Identita' della build
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "BUILD_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # La chiave di rilascio, se il repository ne ha una fra i segreti.
      #
      # Se non c'e' - ed e' il caso normale - la build usa quella versionata in
      # app/release.keystore, che e' fissa e va benissimo: quello che conta per
      # Play Protect e' che la firma resti **la stessa** da una build all'altra,
      # non che sia segreta.
      - name: Chiave di rilascio dai segreti
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rilascio.keystore"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/rilascio.keystore" >> "$GITHUB_ENV"

      # Niente --stacktrace: seppelliva gli errori Kotlin sotto trecento righe
      # di stack Gradle. Se fallisce, gli errori veri finiscono in coda al log.
      #
      # Si costruisce la variante di **rilascio**, non piu' quella di debug. La
      # debug resta per l'emulatore degli screenshot, ma quella che finisce in
      # mano alle persone dev'essere una build di rilascio firmata con la chiave
      # dell'app: un APK di debug si presenta ad Android per quello che e' -
      # roba non distribuibile, firmata da "Android Debug" come migliaia di
      # altre build sperimentali - ed e' meta' del motivo per cui Play Protect
      # metteva di mezzo un avviso.
      - name: assemble
        run: |
          set -o pipefail
          ./gradlew assembleRelease assembleDebug --no-daemon 2>&1 | tee /tmp/build.log || {
            echo ""
            echo "================= ERRORI DI COMPILAZIONE ================="
            grep -E "^e: |^w: .*(error|Error)" /tmp/build.log | head -40
            echo "=========================================================="
            exit 1
          }

      # Una firma sbagliata non fa fallire la build: fa fallire l'installazione,
      # sul telefono, a scaricamento gia' fatto. Meglio accorgersene qui.
      - name: Verifica la firma
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "pacchetto: $APK"
          BT=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" \
            | grep -E "^package|application-label" || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # L'emulatore installa la debug: la release non e' debuggabile ne'
      # installabile su un emulatore senza passare dalla stessa firma, e agli
      # screenshot serve solo che l'app parta.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Livello 3: l'APK in mano al telefono. Tag fisso, cosi' il link resta
  # sempre lo stesso e si puo' salvare fra i preferiti.
  rilascio:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Prepara il file
        run: |
          mkdir -p rilascio
          cp "$(find apk -name '*.apk' | head -1)" rilascio/weather.apk
          ls -la rilascio

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Weather — ultima build
          prerelease: true
          files: rilascio/weather.apk
          body: |
            APK di debug, sempre aggiornato all'ultimo commit del branch di sviluppo.

            **Installazione dal telefono**
            1. Tocca `weather.apk` qui sotto per scaricarlo.
            2. Android chiedera' di autorizzare l'installazione da questa
               sorgente: e' la richiesta normale per le app fuori dallo store.
            3. Apri il file scaricato e installa.

            Build di **rilascio**, firmata con la chiave dell'app, sempre la
            stessa: le build successive si installano sopra la precedente senza
            doverla disinstallare, e il numero di versione cresce a ogni
            pubblicazione.

            Commit: ${{ github.sha }}

      # Il rilascio conserva gli allegati che nessuno sovrascrive. Rinominando
      # l'APK ne sono rimasti due, uno vecchio e uno nuovo, e chi arriva sulla
      # pagina non ha modo di sapere quale sia quello buono: se ne scarica uno a
      # caso e installa l'app di ieri.
      - name: Togli gli allegati che non c'entrano piu'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          presenti=$(gh release view apk-latest --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')
          for allegato in $presenti; do
            [ "$allegato" = "weather.apk" ] && continue
            echo "rimuovo allegato obsoleto: $allegato"
            gh release delete-asset apk-latest "$allegato" \
              --repo "$GITHUB_REPOSITORY" --yes
          done

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "kvm:"; ls -l /dev/kvm || echo "NESSUN /dev/kvm"

      - uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Emulatore e cattura
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/capture.sh

      - name: Pubblica
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish.sh screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: /tmp/ciout
          if-no-files-found: warn
